services:
  social-database:
    build:
      context: .
    environment:
      SOCIAL_DATABASE_API_TOKEN: ${SOCIAL_DATABASE_API_TOKEN:?set SOCIAL_DATABASE_API_TOKEN}
      SOCIAL_DATABASE_PREVIOUS_API_TOKEN: ${SOCIAL_DATABASE_PREVIOUS_API_TOKEN:-}
      SOCIAL_DATABASE_DOCS: ${SOCIAL_DATABASE_DOCS:-false}
    ports:
      - "127.0.0.1:${SOCIAL_DATABASE_HTTP_PORT:-8000}:8000"
    volumes:
      - social-database-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  social-database-data:
