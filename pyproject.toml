[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "social-database"
version = "0.7.0"
description = "Import and search group member data with Excel and SQLite."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "马骏珩" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]
dev = [
    "build>=1.5,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<10.0",
    "uvicorn>=0.30,<1.0",
]

[project.urls]
Homepage = "https://github.com/tntexploding/SocialDatabase"
Repository = "https://github.com/tntexploding/SocialDatabase"
Issues = "https://github.com/tntexploding/SocialDatabase/issues"

[project.scripts]
social-database = "social_database.cli:main"

[tool.setuptools.packages.find]
include = ["social_database*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"
